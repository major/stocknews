[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stocknews"
version = "0.1.0"
description = "Filter Alpaca stock news and send matching items to Discord webhooks."
requires-python = ">=3.14"
dependencies = [
    "anyio>=4,<5",
    "httpcore2==2.13.1",
    "httpx2[ws]==2.13.1",
    "tzdata>=2024.1",
]

[project.scripts]
stocknews = "stocknews.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "mypy>=1.15",
    "pip-audit>=2.9",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-randomly>=3.15",
    "pytest-socket>=0.8.1",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stocknews"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/stocknews"]

[tool.pyright]
include = ["src/stocknews"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
# Loopback tests can opt in with pytest.mark.allow_hosts(["127.0.0.1", "::1"]).
addopts = "--cov-context=test --disable-socket --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
core = "ctrace"
branch = true
patch = ["subprocess"]
source = ["stocknews"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
show_contexts = true

[tool.mutmut]
source_paths = ["src/stocknews"]
only_mutate = ["src/stocknews/earnings.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_earnings.py",
    "tests/test_news.py",
    "tests/test_domain_properties.py",
]

[tool.uv]
default-groups = ["dev"]
required-version = "==0.12.18"

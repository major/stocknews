coverage:
  range: 95..100
  round: down
  precision: 1
  status:
    project:
      default:
        informational: true
        target: 95%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        informational: true
        target: 100%
        threshold: 0%
        if_ci_failed: error
